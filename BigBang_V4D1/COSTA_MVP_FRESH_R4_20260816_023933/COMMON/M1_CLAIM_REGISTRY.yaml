estimand: relative heldout NRMSE improvement and paired epoch MSE advantage of FIT-selected personalized candidate versus matched C000
null_hypothesis: FIT-selected candidate does not improve heldout NRMSE by 0.05 and/or paired MSE advantage is not strictly positive at the lower 95% bootstrap bound
competing_hypothesis: FIT-selected candidate improves heldout NRMSE by at least 0.05 and has strictly positive lower 95% paired epoch-bootstrap MSE-advantage bound
