minimum_events: at least 4 eligible N3 epochs and at least 2 valid epochs in each FIT and HELDOUT role
missing_data_rule: exclude only nonfinite, flat, too-short, or out-of-range epochs after fixed role assignment; no reassignment; minimum denominators remain mandatory
invalid_run_rule: any hash, environment, schema, path, split, call-signature, role-open-order, or nonfinite-result mismatch makes the run INVALID
