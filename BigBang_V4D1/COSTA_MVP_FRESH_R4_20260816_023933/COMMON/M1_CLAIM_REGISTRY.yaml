seed_rule: partition 26081601; fixture 26081602; noise 26081603; bootstrap 26081604; exact imported seeds only
attempt_budget: one frozen worker execution plus one fresh independent reproduction; maximum two outcome-blind repair cycles before outcomes only
failure_rule: any mandatory gate FAIL/INVALID/NOT_ESTIMABLE/NOT_RUN prevents M1 assignment
stop_rule: close M1_PARTIAL or M1_FAIL after a valid mandatory-gate failure; never tune or reopen based on HELDOUT
retry_rule: no scientific retry; only frozen-budget deterministic infrastructure repair before outcomes
claim_ceiling: proxy-level single-subject model-internal personalized mechanistic consistency; P0; no empirical wrong-subject or population generalization
allowed_wording: Model-internal personalized mechanistic consistency was independently reproduced for a frozen proxy-level one-subject Night-1 discovery analysis, if and only if every gate passes.
